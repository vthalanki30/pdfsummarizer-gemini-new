[project]
name = "pdfsummarizer-gemini"
version = "0.1.0"
description = "End-to-end PDF summariser and document Q&A with LangChain + Google Gemini"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls the real Gemini API (skipped unless explicitly selected)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
